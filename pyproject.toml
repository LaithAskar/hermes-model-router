[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-model-router"
version = "0.1.0"
description = "Cost-aware task routing for Hermes Agent"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Laith Askar"}]
dependencies = []

[project.scripts]
hermes-route = "hermes_router.cli:main"

[tool.setuptools.packages.find]
include = ["hermes_router*"]
